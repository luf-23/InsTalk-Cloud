services:
  redis:
    image: redis:7-alpine
    container_name: local_redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: local_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ins_talk
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    container_name: local_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: instalk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instalk"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: "no"

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: local_nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
    volumes:
      - ./nacos_data:/home/nacos/data
      - ./nacos-conf/application.properties:/home/nacos/conf/application.properties
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: local_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    restart: "no"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  instalk-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: instalk-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: on-failure

  instalk-identity-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: instalk-identity-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: on-failure

  instalk-social-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: instalk-social-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: on-failure

  instalk-chat-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: instalk-chat-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: on-failure

  instalk-ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: instalk-ai-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: on-failure

  instalk-frontend:
    build:
      context: ../InsTalk-Frontend
      dockerfile: Dockerfile
    container_name: instalk_frontend
    ports:
      - "80:80"
    depends_on:
      - instalk-gateway
    restart: on-failure
